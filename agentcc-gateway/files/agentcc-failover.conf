# Agent Command Center - two-host round-robin + failover example.
#
# This is the setup that was tested against two llama.cpp instances serving
# the same GGUF under different model paths. Clients request the canonical
# model name ("qwen2.5-0.5b") and the gateway translates it per target via
# model_override, alternating requests and failing over if one host dies.
#
# IMPORTANT: do NOT list the canonical name in model_map. A model_map entry
# marks the model "explicit" and the gateway then uses SelectExactModel,
# which skips targets whose model_override differs from the requested model.
# Without the map entry, plain Select applies the per-target model_override.

server:
  port: 18080
  host: "0.0.0.0"
  read_header_timeout: 5s
  read_timeout: 60s
  write_timeout: 300s
  idle_timeout: 120s
  shutdown_timeout: 30s
  max_request_body_size: 10485760
  default_request_timeout: 120s

providers:
  llama1:
    base_url: "http://host1:8089"
    api_format: "openai"
    type: "ollama"
    default_timeout: 120s
    max_concurrent: 10
    conn_pool_size: 10
  llama2:
    base_url: "http://host2:8080"
    api_format: "openai"
    type: "ollama"
    default_timeout: 120s
    max_concurrent: 10
    conn_pool_size: 10

routing:
  default_strategy: "round-robin"     # round-robin | weighted | least-latency | cost-optimized
  failover:
    enabled: true
    max_attempts: 3
    on_status_codes: [429, 500, 502, 503, 504]
    on_timeout: true
  targets:
    "qwen2.5-0.5b":                  # canonical name used by clients
      - provider: llama1
        weight: 50
        model_override: "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
      - provider: llama2
        weight: 50
        model_override: "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

# Needed for browser-based clients hitting the gateway from another origin:
cors:
  enabled: true
  allowed_origins: ["*"]

logging:
  level: info