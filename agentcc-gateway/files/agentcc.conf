# Agent Command Center (agentcc-gateway) configuration.
#
# This is the default config installed by pkgsrc. It starts the gateway
# with no providers, which is safe but not useful yet: the /v1/models list
# will be empty. Add at least one provider (see /usr/pkg/share/examples/
# agentcc/agentcc-failover.conf for a two-host round-robin/failover setup).
#
# See also the full upstream example with every option documented:
#   /usr/pkg/share/examples/agentcc/config.example.yaml

server:
  port: 18080
  host: "0.0.0.0"
  read_header_timeout: 5s
  read_timeout: 60s
  write_timeout: 300s
  idle_timeout: 120s
  shutdown_timeout: 30s
  max_request_body_size: 10485760   # 10MB
  default_request_timeout: 120s

# Uncomment and adjust to enable a provider:
# providers:
#   llama:
#     base_url: "http://127.0.0.1:8089"   # llama-server / Ollama etc.
#     api_format: "openai"
#     type: "ollama"                       # local endpoint: auto-discovery
#     default_timeout: 120s
#     max_concurrent: 10
#     conn_pool_size: 10

# Uncomment to restrict access with virtual API keys:
# auth:
#   enabled: true
#   keys:
#     - name: "dev"
#       key: "sk-agentcc-dev-key"
#       owner: "local"

# Uncomment to enable CORS for browser-based clients:
# cors:
#   enabled: true
#   allowed_origins: ["*"]

# Uncomment to serve Prometheus metrics (needs admin token):
# admin:
#   token: "change-me"
# prometheus:
#   enabled: true
#   path: "/-/metrics"

logging:
  level: info