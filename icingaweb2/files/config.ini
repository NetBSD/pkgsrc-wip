[global]
show_stacktraces= "0"
module_path	= "@SHAREDIR@/modules"
;config_resource= "icingaweb_db"

[security]
;use_strict_csp	= "1"

[logging]
log		= "syslog"
level		= "ERROR"
facility	= "local0"
application	= "icingaweb2"
;log		= "file"
;level		= "DEBUG"
;file		= "@LOGDIR@/icingaweb2.log"

;[preferences]
;type		= "db"
;resource	= "icingaweb2"

;[themes]
;disabled	= "1"
;default	= "high-contrast"
