$NetBSD$

Replace the git dependencies with the repositories extracted under
${WRKDIR}/git by GITHUB_SUBMODULES, so the build works offline.

--- Cargo.toml.orig	2026-11-04 22:18:25.973727423 +0000
+++ Cargo.toml
@@ -10,11 +10,11 @@ repository = "https://github.com/storytold/lightcraft"
 repository = "https://github.com/storytold/lightcraft"
 
 [workspace.dependencies]
-craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["serde"] }
-craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
+craft-ui = { path = "../git/craft-libs/crates/ui", features = ["serde"] }
+craft-docpath = { version = "0.1.0", path = "../git/craft-libs/crates/docpath" }
 # craft-update: app-specific pretend versions apply to startup and manual checks.
-craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["egui"] }
-craft-window = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["egui"] }
+craft-update = { path = "../git/craft-libs/crates/update", version = "=0.1.0", features = ["egui"] }
+craft-window = { path = "../git/craft-libs/crates/window", features = ["egui"] }
 # internal
 lightcraft-denoise-core = { path = "crates/denoise-core" }
 lightcraft-denoise = { path = "crates/denoise", default-features = false }
