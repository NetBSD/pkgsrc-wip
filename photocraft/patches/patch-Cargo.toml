$NetBSD$

Replace the git dependencies with the repositories extracted under
${WRKDIR}/git by GITHUB_SUBMODULES, so the build works offline.

--- Cargo.toml.orig
+++ Cargo.toml
@@ -10,7 +10,7 @@
 rust-version = "1.95"
 
 [workspace.dependencies]
-craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", features = ["serde"] }
+craft-ui = { path = "../git/craft-libs/crates/ui", features = ["serde"] }
 # internal
 photocraft-geom = { path = "crates/geom" }
 photocraft-color = { path = "crates/color" }
@@ -39,10 +39,10 @@
 photocraft-ipp = { path = "crates/ipp" }
 
 # external
-craft-print = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
-craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
-craft-jpeg = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
-craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", features = ["egui"] }
+craft-print = { path = "../git/craft-libs/crates/print" }
+craft-docpath = { version = "0.1.0", path = "../git/craft-libs/crates/docpath" }
+craft-jpeg = { path = "../git/craft-libs/crates/jpeg" }
+craft-update = { path = "../git/craft-libs/crates/update", version = "=0.1.0", features = ["egui"] }
 thiserror = "2"
 serde = { version = "1", features = ["derive", "rc"] }
 serde_json = "1"
