Add sub-path to libsql, as this is not currently handled by cargo.mk.

--- Cargo.toml.orig	2026-11-11 06:32:02.791137108 +0000
+++ Cargo.toml
@@ -312,7 +312,7 @@ tar = { path = "vendor/tar" }
