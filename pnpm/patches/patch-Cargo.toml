 # SQL metadata store sends each write transaction in two round trips with it;
 # no upstream release has an equivalent.
-libsql = { git = "https://github.com/pnpm/libsql", rev = "ab8a7516c7d32d6fdd0f68d59956c6233f9f11d4" }
+libsql = { path = "../libsql-ab8a7516c7d32d6fdd0f68d59956c6233f9f11d4/libsql" }
 node-semver = { git = "https://github.com/pnpm/node-semver-rs", rev = "3d74d6b7f4de1de2006cf2f7663aac09de65b1f6" }
